<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travelo</title>
    <link rel="stylesheet" href="task8.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header>
        <div class="allhead">
            <div id="lefthead">
                <a href="#"><img src="https://preview.colorlib.com/theme/travelo/img/logo.avif" alt="logo"></a>
            </div>

            <div class="center">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Destination</a></li>
                    <li><a href="">Pages</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>

            <div id="righthead">
                <div id="tel">
                    <i class="fa-solid fa-phone" style="color: #ff4a53"></i>
                    +1 555 0186 256
                </div>
                <div class="sociallogo">
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-linkedin"></i>
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-x-twitter"></i>
                </div>
            </div>
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
    </header>

    <main>
        <h3>Vietnam</h3>
        <p>Green valleys and paragliding hills</p>
        <button id="btnexplore">Explore Now</button>
    </main>

    <section>
        <div id="whereugo">
            <h2 style="color: white">Where you want to go?</h2>
            <input type="text" class="inp" placeholder="Where to go?">
            <input type="date" class="inp" style="color: white; color-scheme: dark;">
            <select class="inp" style="color: #aab1b7">
                <option value="">Travel type</option>
                <option value="">Some option</option>
                <option value="">Another option</option>
            </select>
            <button id="btnsearch" type="submit">Search</button>
        </div>
    </section>

</body>
</html>
