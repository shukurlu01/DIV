<html>
<head>
    <meta charset="utf-8">
    <title>Table Layout</title>
</head>
<body>
<table bgcolor="white" border="1" cellspacing="0" width="1000" height="700" align="center" cellpadding="10">
    <tr height="100" bgcolor='orange'>
        <th colspan="3">
            <h1>Albom</h1>
        </th>
    </tr>
    <tr>
        <td align="center" width="20%" valign="top" bgcolor="yellow">
            <ul type='none'>
                <li>Ana sehife</li>
                <li>Haqqimizda</li>
                <li>Foto Albom</li>
                <li>Elaqeler</li>
            </ul>
        </td>
        <td valign="top">
            <h2>Lionel Messi</h2>
        </td>
        <td align="center" valign="top" width="160" bgcolor="gray"></td>
    </tr>
    <tr height="50">
        <td colspan="3" align="center" bgcolor="red">
            <font color="white" size='2' face='italic'>
                Copyright &copy 2026
            </font>
        </td>
    </tr>
</table>

</body>
</html>
